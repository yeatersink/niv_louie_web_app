name: Deploy to Fedora Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted   # ← This tells GitHub to use your runner on the Fedora machine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Niv Louie App
        run: |
          echo "Starting deployment on self-hosted runner..."
          cd ~/niv-louie-app
          git pull origin main
          docker compose down
          docker compose build --no-cache
          docker compose up -d
          echo "Deployment completed at $(date)"
          docker compose ps