name: Deploy to Fedora Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0   # Get full history if needed

      - name: Deploy Niv Louie App
        run: |
          echo "Starting deployment on self-hosted runner..."
          cd ~/niv-louie-app

          # Force pull using the token to be safe
          git pull origin main

          echo "Building and restarting containers..."
          docker compose down
          docker compose build --no-cache
          docker compose up -d

          echo "Deployment completed at $(date)"
          docker compose ps
          docker compose logs --tail=10