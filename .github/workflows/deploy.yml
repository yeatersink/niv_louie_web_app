name: Deploy to Fedora Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code using SSH
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}   # We'll add this secret next
          ssh-strategy: ssh

      - name: Deploy Niv Louie App
        run: |
          echo "Starting deployment on self-hosted runner..."
          cd ~/niv-louie-app

          git pull origin main

          echo "Building and restarting containers..."
          docker compose down
          docker compose build --no-cache
          docker compose up -d

          echo "Deployment completed at $(date)"
          docker compose ps
          docker compose logs --tail=10