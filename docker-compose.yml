services:
  nicegui-app:
    build: .
    container_name: niv_louie_web_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DOCKER=1
    volumes:
      # Mount the static folder from host to container (absolute path - most reliable)
      - /home/yeatersink/niv-louie-app/static:/app/static:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token eyJhIjoiNzM5MzlhZmVhOWFiMDY3YThmYzZiMmZiZjA5OTFiMDkiLCJ0IjoiYzIzMDM4NWUtNDgxZC00OTg0LTlkNTUtYWRjOTBkYzg4ZjA5IiwicyI6Ik1qRXhOV0V4WW1JdFpXUTBOeTAwTXpoakxUa3paalV0TlRsaE9XSTRZV013TldSbSJ9
    depends_on:
      - nicegui-app
    network_mode: "service:nicegui-app"